# Roles are mapped to providers, not calls to models (design doc 4.1).
#
# The outline call happens once and defines the whole game -- worth spending on.
# Zone authoring happens dozens of times with narrow context, which is the case
# for local inference; swap it over by uncommenting the local block once an
# Ollama server is running. Nothing else in the codebase changes.
#
# WHY THESE ARE ALL OpenAI MODELS, despite the design doc's "strong model" being
# provider-agnostic: OpenRouter's `strict` json_schema is only enforced
# server-side for some upstreams. OpenAI models honour it. Anthropic models
# accept the request, return HTTP 200, and quietly ignore the schema on anything
# as nested as the event-command palette -- measured, not assumed. The provider
# catches that (it validates every response against the schema it asked for), but
# a model that fails verification every time just burns the repair budget.
# Using Claude models here needs the tool-calling path instead of
# response_format; that is a worthwhile change, not a config tweak.
llm:
  enabled: true

  outline:
    provider: lmstudio
    model: gemma-4-26b-a4b-it-heretic-guff
    base_url: http://127.0.0.1:1234/v1
    max_tokens: 10000
    timeout: 900

  zone_author:
    provider: openrouter
    model: gemma-4-26b-a4b-it-heretic-guff
    base_url: http://127.0.0.1:1234/v1
    max_tokens: 10000
    timeout: 900

    # --- running this role locally ---------------------------------------
    # Anything speaking the OpenAI chat API works: LM Studio, llama.cpp's
    # server, vLLM. Only the base_url differs, and it can also come from the
    # environment (LMSTUDIO_BASE_URL, or LOCAL_LLM_BASE_URL for any of them),
    # so a server on another machine needs no edit here.
    #
    #   provider: lmstudio
    #   model: qwen/qwen3.8-27b
    #   base_url: http://127.0.0.1:1234/v1
    #   max_tokens: 8000     # reasoning models spend most of this thinking
    #   timeout: 900         # and a 27B model is not quick about it
    #
    # Ollama speaks its own API rather than OpenAI's, so it has its own type:
    #
    #   provider: ollama
    #   model: llama3.1:8b
    #
    # Before switching, check the model can actually hold the schemas:
    #   python -m backend.llm.probe --provider lmstudio --model MODEL \
    #       --base-url http://HOST:1234/v1

  # Used for the single repair round-trip, deliberately stronger than the model
  # whose output failed validation.
  fallback:
    provider: openrouter
    model: openai/gpt-4.1
    max_tokens: 4000
