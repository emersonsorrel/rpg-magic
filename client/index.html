<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rpg-magic — M1</title>
    <script type="importmap">
      { "imports": { "phaser": "/client/node_modules/phaser/dist/phaser.esm.js" } }
    </script>
    <style>
      :root {
        --ink: #e8e6df;
        --dim: #9aa0ae;
        --bg: #0b0d12;
        --panel: #151a24;
        --line: #262e3d;
        --accent: #ffd98a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        height: 100vh;
        overflow: hidden;
        align-items: stretch;
      }
      #game {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        min-width: 0;
      }
      #game canvas { image-rendering: pixelated; box-shadow: 0 0 0 1px var(--line), 0 18px 50px #0007; }
      #shell {
        flex: 0 0 300px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        padding: 16px;
        overflow-y: auto;
        max-height: 100vh;
      }
      h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .04em; }
      h1 .tag {
        font-size: 10px; color: var(--bg); background: var(--accent);
        border-radius: 3px; padding: 1px 5px; vertical-align: 2px;
      }
      h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
        color: var(--dim); margin: 18px 0 6px; border-bottom: 1px solid var(--line);
        padding-bottom: 4px;
      }
      .zone, .controls { color: var(--dim); font-size: 12px; margin: 0 0 4px; }
      .seedbar { display: flex; gap: 6px; margin-bottom: 6px; }
      .seedbar input {
        flex: 1 1 auto; min-width: 0; background: #0e131b; color: var(--ink);
        border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px;
        font: inherit; font-size: 12px;
      }
      .seedbar button {
        background: var(--accent); color: #1a1206; border: 0; border-radius: 3px;
        padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      }
      .seedbar button:hover { filter: brightness(1.08); }
      ul, ol { list-style: none; margin: 0; padding: 0; }
      .kv li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
      .kv span { color: var(--dim); }
      .kv b { font-weight: 600; }
      .kv b.on { color: #86e08a; }
      .kv b.off { color: #6a7284; }
      .kv .empty { color: #6a7284; }
      .toggle { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; cursor: pointer; }
      .toggle span { font-size: 12px; color: var(--ink); }
      .toggle input { accent-color: var(--accent); }
      .saves li { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; }
      .saves li span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .saves b.dim { color: var(--dim); font-weight: 400; margin-left: 4px; }
      .saves button {
        flex: 0 0 auto; background: #223049; color: var(--ink); border: 1px solid var(--line);
        border-radius: 3px; padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer;
      }
      .saves button:hover { background: #2c3c5c; }
      .saves .empty { color: #6a7284; }
      .log { font-size: 11px; color: var(--dim); max-height: 260px; overflow-y: auto; }
      .log li { padding: 2px 0; border-bottom: 1px solid #1c2330; word-break: break-word; }
      .fatal { color: #ff9d9d; font-size: 13px; max-width: 640px; }
      .fatal pre { white-space: pre-wrap; color: var(--dim); }
      @media (max-width: 900px) {
        body { flex-direction: column; }
        #shell { flex: 1 1 auto; border-left: none; border-top: 1px solid var(--line); max-height: none; }
      }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <aside id="shell"></aside>
    <script type="module" src="/client/src/main.js"></script>
  </body>
</html>
